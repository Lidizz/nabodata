app = "nabodata-tiles"
primary_region = "arn"

[build]

[env]
  # DATABASE_URL is set via: fly secrets set DATABASE_URL="..."

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
