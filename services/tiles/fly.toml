app = "nabodata-tiles"
primary_region = "arn"

[build]
  image = "ghcr.io/maplibre/martin:latest"

[env]
  # DATABASE_URL is set as a Fly.io secret

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "martin_config"
  destination = "/config"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
