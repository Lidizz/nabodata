<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stat card</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="eyebrow">Stat card · used inside data panel</div>
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
    <div style="background: var(--surface-1); border: 1px solid var(--border-1); border-radius: 8px; padding: 14px;">
      <div class="label" style="margin-bottom: 6px;">Innbyggere</div>
      <div class="display" style="font-size: 26px;">285 911</div>
      <div style="font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--success); margin-top: 6px;">▲ +1,8 % siste år</div>
    </div>
    <div style="background: var(--surface-1); border: 1px solid var(--border-1); border-radius: 8px; padding: 14px;">
      <div class="label" style="margin-bottom: 6px;">Tetthet</div>
      <div class="display" style="font-size: 26px;">624</div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 6px;">innb. / km²</div>
    </div>
    <div style="background: var(--surface-1); border: 1px solid var(--border-1); border-radius: 8px; padding: 14px;">
      <div class="label" style="margin-bottom: 6px;">Median­inntekt</div>
      <div class="display" style="font-size: 26px;">548 200</div>
      <div style="font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--danger); margin-top: 6px;">▼ −0,3 % vs. nasjonalt</div>
    </div>
  </div>
</div>
</body>
</html>
