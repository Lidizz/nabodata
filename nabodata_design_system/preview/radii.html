<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="eyebrow">Corner radii · crisp on chrome, soft on cards</div>
  <div class="row" style="gap: 18px;">
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:48px; background:var(--surface-2); border:1px solid var(--border-1); border-radius: 0;"></div>
      <span class="data-label">r-0 · 0</span>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:48px; background:var(--surface-2); border:1px solid var(--border-1); border-radius: 2px;"></div>
      <span class="data-label">r-1 · 2</span>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:48px; background:var(--surface-2); border:1px solid var(--border-1); border-radius: 4px;"></div>
      <span class="data-label">r-2 · 4</span>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:48px; background:var(--surface-2); border:1px solid var(--border-1); border-radius: 8px;"></div>
      <span class="data-label">r-3 · 8</span>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:48px; background:var(--surface-2); border:1px solid var(--border-1); border-radius: 12px;"></div>
      <span class="data-label">r-4 · 12</span>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:48px; background:var(--surface-2); border:1px solid var(--border-1); border-radius: 16px;"></div>
      <span class="data-label">r-5 · 16</span>
    </div>
    <div class="col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:48px; background:var(--surface-2); border:1px solid var(--border-1); border-radius: 999px;"></div>
      <span class="data-label">pill</span>
    </div>
  </div>
  <div class="data-label" style="margin-top: 4px;">map chrome · 4 / cards · 8 / panel · 12 / sheet · 16</div>
</div>
</body>
</html>
