<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colors — Light surfaces &amp; text</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="eyebrow">Light theme · surfaces &amp; text</div>
  <div class="grid" style="grid-template-columns: repeat(5, 1fr);">
    <div class="swatch"><div class="chip" style="background:#F7F8FA"></div><div class="meta"><div class="name">bg</div><div class="hex">#F7F8FA</div></div></div>
    <div class="swatch"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">surface-1</div><div class="hex">#FFFFFF</div></div></div>
    <div class="swatch"><div class="chip" style="background:#F2F4F7"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#F2F4F7</div></div></div>
    <div class="swatch"><div class="chip" style="background:#E8ECF1"></div><div class="meta"><div class="name">surface-3</div><div class="hex">#E8ECF1</div></div></div>
    <div class="swatch"><div class="chip" style="background:#E4E8EE"></div><div class="meta"><div class="name">border-1</div><div class="hex">#E4E8EE</div></div></div>
  </div>
  <div class="grid" style="grid-template-columns: repeat(4, 1fr);">
    <div class="swatch"><div class="chip" style="background:#0F1723"></div><div class="meta"><div class="name">fg-1</div><div class="hex">#0F1723</div></div></div>
    <div class="swatch"><div class="chip" style="background:#3D4A5C"></div><div class="meta"><div class="name">fg-2</div><div class="hex">#3D4A5C</div></div></div>
    <div class="swatch"><div class="chip" style="background:#6B7787"></div><div class="meta"><div class="name">fg-3</div><div class="hex">#6B7787</div></div></div>
    <div class="swatch"><div class="chip" style="background:#9AA3B2"></div><div class="meta"><div class="name">fg-4</div><div class="hex">#9AA3B2</div></div></div>
  </div>
</div>
</body>
</html>
