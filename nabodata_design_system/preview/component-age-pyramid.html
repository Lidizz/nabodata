<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Age pyramid</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="h3">Aldersfordeling</div>
    <div class="data-label">Bergen · 2024</div>
  </div>
  <!-- pyramid -->
  <svg viewBox="0 0 660 200" width="100%" height="170" font-family="IBM Plex Mono, monospace">
    <!-- center axis -->
    <line x1="330" y1="0" x2="330" y2="180" stroke="#E4E8EE" stroke-width="1"/>
    <!-- 9 age bands -->
    <g font-size="9" fill="#6B7787">
      <text x="320" y="14" text-anchor="end">0–9</text>
      <text x="320" y="32" text-anchor="end">10–19</text>
      <text x="320" y="50" text-anchor="end">20–29</text>
      <text x="320" y="68" text-anchor="end">30–39</text>
      <text x="320" y="86" text-anchor="end">40–49</text>
      <text x="320" y="104" text-anchor="end">50–59</text>
      <text x="320" y="122" text-anchor="end">60–69</text>
      <text x="320" y="140" text-anchor="end">70–79</text>
      <text x="320" y="158" text-anchor="end">80+</text>
    </g>
    <!-- bars: women (right, fjord), men (left, copper) -->
    <g>
      <rect x="234" y="6" width="92" height="14" fill="#B86E3C"/>
      <rect x="334" y="6" width="88" height="14" fill="#0E7C86"/>
      <rect x="216" y="24" width="110" height="14" fill="#B86E3C"/>
      <rect x="334" y="24" width="106" height="14" fill="#0E7C86"/>
      <rect x="200" y="42" width="126" height="14" fill="#B86E3C"/>
      <rect x="334" y="42" width="130" height="14" fill="#0E7C86"/>
      <rect x="190" y="60" width="136" height="14" fill="#B86E3C"/>
      <rect x="334" y="60" width="138" height="14" fill="#0E7C86"/>
      <rect x="220" y="78" width="106" height="14" fill="#B86E3C"/>
      <rect x="334" y="78" width="112" height="14" fill="#0E7C86"/>
      <rect x="232" y="96" width="94" height="14" fill="#B86E3C"/>
      <rect x="334" y="96" width="100" height="14" fill="#0E7C86"/>
      <rect x="246" y="114" width="80" height="14" fill="#B86E3C"/>
      <rect x="334" y="114" width="86" height="14" fill="#0E7C86"/>
      <rect x="266" y="132" width="60" height="14" fill="#B86E3C"/>
      <rect x="334" y="132" width="68" height="14" fill="#0E7C86"/>
      <rect x="290" y="150" width="36" height="14" fill="#B86E3C"/>
      <rect x="334" y="150" width="46" height="14" fill="#0E7C86"/>
    </g>
    <text x="60" y="190" font-size="10" fill="#6B7787">Menn</text>
    <text x="600" y="190" font-size="10" fill="#6B7787" text-anchor="end">Kvinner</text>
  </svg>
</div>
</body>
</html>
