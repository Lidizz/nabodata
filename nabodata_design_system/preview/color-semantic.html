<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Semantic colors</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="eyebrow">Semantic · status &amp; feedback</div>
  <div class="grid" style="grid-template-columns: repeat(4, 1fr);">
    <div class="swatch"><div class="chip" style="background:#2E7D5B"></div><div class="meta"><div class="name">success</div><div class="hex">#2E7D5B</div></div></div>
    <div class="swatch"><div class="chip" style="background:#B5740E"></div><div class="meta"><div class="name">warning</div><div class="hex">#B5740E</div></div></div>
    <div class="swatch"><div class="chip" style="background:#B23A48"></div><div class="meta"><div class="name">danger · lingonberry</div><div class="hex">#B23A48</div></div></div>
    <div class="swatch"><div class="chip" style="background:#2C5F90"></div><div class="meta"><div class="name">info</div><div class="hex">#2C5F90</div></div></div>
  </div>
  <div class="row" style="gap: 16px; font-size: 13px; font-variant-numeric: tabular-nums;">
    <span style="color:#2E7D5B;">▲ +1,8 %</span>
    <span style="color:#B5740E;">⚠ Datakilde foreldet</span>
    <span style="color:#B23A48;">▼ −0,3 %</span>
    <span style="color:#2C5F90;">i Oppdatert i dag</span>
  </div>
</div>
</body>
</html>
