<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="eyebrow">Spacing · 4px base</div>

      <span class="data-label">sp-1 · 4</span>
      <div style="height:8px; background:var(--accent-soft); border-radius:1px; width: 4px;"></div>

    </div>

    </div>
