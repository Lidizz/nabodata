<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Choropleth — Dark</title>
<link rel="stylesheet" href="_preview.css">
<style>body{background:#0B0F14;}</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Choropleth · Dark · warm amber → teal · 7 steps</div>
  <div style="display:flex; height: 56px; border-radius: 4px; overflow: hidden; border: 1px solid #1F2731;">
    <div style="flex:1; background:#2B241B"></div>
    <div style="flex:1; background:#4F3D26"></div>
    <div style="flex:1; background:#7A5A36"></div>
    <div style="flex:1; background:#A57850"></div>
    <div style="flex:1; background:#9F9A78"></div>
    <div style="flex:1; background:#5FA3A5"></div>
    <div style="flex:1; background:#2DB7C2"></div>
  </div>
  <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap: 8px; font-family: var(--font-mono); font-size: 10px; color: #828D9C;">
    <div>#2B241B</div><div>#4F3D26</div><div>#7A5A36</div><div>#A57850</div><div>#9F9A78</div><div>#5FA3A5</div><div>#2DB7C2</div>
  </div>
  <div style="display:flex; justify-content:space-between; font-size: 11px; color: #B6BFCB; margin-top: 4px;">
    <span>0 – 50 inh./km²</span>
    <span>50 – 200</span>
    <span>200 – 600</span>
    <span>600 – 1 500</span>
    <span>1 500 – 3 000</span>
    <span>3 000 – 6 000</span>
    <span>6 000 +</span>
  </div>
</div>
</body>
</html>
