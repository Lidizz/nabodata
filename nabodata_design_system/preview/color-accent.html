<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accent — Fjord teal</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="eyebrow">Accent · fjord teal · single CTA color across themes</div>
  <div class="grid" style="grid-template-columns: repeat(5, 1fr);">
    <div class="swatch"><div class="chip" style="background:#0E7C86; border-color:#0E7C86"></div><div class="meta"><div class="name">accent · light</div><div class="hex">#0E7C86</div></div></div>
    <div class="swatch"><div class="chip" style="background:#0A6973; border-color:#0A6973"></div><div class="meta"><div class="name">hover</div><div class="hex">#0A6973</div></div></div>
    <div class="swatch"><div class="chip" style="background:#075860; border-color:#075860"></div><div class="meta"><div class="name">press</div><div class="hex">#075860</div></div></div>
    <div class="swatch"><div class="chip" style="background:#DCEFF1"></div><div class="meta"><div class="name">soft</div><div class="hex">#DCEFF1</div></div></div>
    <div class="swatch"><div class="chip" style="background:#2DB7C2; border-color:#2DB7C2"></div><div class="meta"><div class="name">accent · dark</div><div class="hex">#2DB7C2</div></div></div>
  </div>
  <div class="row" style="gap: 14px; margin-top: 4px;">
    <button style="background:#0E7C86; color:white; border:none; border-radius:4px; padding:8px 14px; font:500 13px var(--font-sans);">Sammenlign</button>
    <button style="background:transparent; color:#0E7C86; border:1px solid #0E7C86; border-radius:4px; padding:7px 13px; font:500 13px var(--font-sans);">Vis flere</button>
    <span style="font-size:13px; color: var(--fg-2);">+ selected polygon · active filter · primary CTA</span>
  </div>
</div>
</body>
</html>
