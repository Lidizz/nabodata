<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data viz palette</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="eyebrow">Data-viz palette · 8 hues · AA against light &amp; dark</div>
  <div class="grid" style="grid-template-columns: repeat(8, 1fr);">
    <div class="swatch"><div class="chip" style="background:#0E7C86; border-color:#0E7C86"></div><div class="meta"><div class="name">fjord</div><div class="hex">#0E7C86</div></div></div>
    <div class="swatch"><div class="chip" style="background:#6B8E4E; border-color:#6B8E4E"></div><div class="meta"><div class="name">lichen</div><div class="hex">#6B8E4E</div></div></div>
    <div class="swatch"><div class="chip" style="background:#B23A48; border-color:#B23A48"></div><div class="meta"><div class="name">lingonberry</div><div class="hex">#B23A48</div></div></div>
    <div class="swatch"><div class="chip" style="background:#B86E3C; border-color:#B86E3C"></div><div class="meta"><div class="name">copper</div><div class="hex">#B86E3C</div></div></div>
    <div class="swatch"><div class="chip" style="background:#5C6B7A; border-color:#5C6B7A"></div><div class="meta"><div class="name">slate</div><div class="hex">#5C6B7A</div></div></div>
    <div class="swatch"><div class="chip" style="background:#C8A65A; border-color:#C8A65A"></div><div class="meta"><div class="name">birch</div><div class="hex">#C8A65A</div></div></div>
    <div class="swatch"><div class="chip" style="background:#6E4C7A; border-color:#6E4C7A"></div><div class="meta"><div class="name">plum</div><div class="hex">#6E4C7A</div></div></div>
    <div class="swatch"><div class="chip" style="background:#5A8FBF; border-color:#5A8FBF"></div><div class="meta"><div class="name">sky</div><div class="hex">#5A8FBF</div></div></div>
  </div>
  <!-- Mini bar demo -->
  <div style="display:flex; align-items:flex-end; gap:6px; height:32px; margin-top: 4px;">
    <div style="width:18px; height:80%; background:#0E7C86; border-radius:1px;"></div>
    <div style="width:18px; height:62%; background:#6B8E4E; border-radius:1px;"></div>
    <div style="width:18px; height:48%; background:#B23A48; border-radius:1px;"></div>
    <div style="width:18px; height:35%; background:#B86E3C; border-radius:1px;"></div>
    <div style="width:18px; height:25%; background:#5C6B7A; border-radius:1px;"></div>
    <div style="width:18px; height:18%; background:#C8A65A; border-radius:1px;"></div>
    <span class="data-label" style="margin-left: 8px;">Top 6 origin countries · stacked use</span>
  </div>
</div>
</body>
</html>
