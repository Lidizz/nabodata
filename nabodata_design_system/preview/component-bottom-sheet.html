<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile bottom sheet</title>
<link rel="stylesheet" href="_preview.css">
<style>body{background:#1F2A24;}</style>
</head>
<body>
<div class="card" style="background: transparent; padding: 14px; gap: 8px;">
  <div class="eyebrow" style="color:#A19E91;">Mobile bottom sheet · 3 snap heights</div>
  <div class="row" style="gap: 14px; height: 100%; align-items: stretch;">
    <!-- Peek -->
    <div style="position: relative; flex:1; background: linear-gradient(180deg, #487C81, #275F76); border-radius: 12px; overflow: hidden;">
      <div style="position:absolute; left:0; right:0; bottom:0; background: var(--surface-1); padding: 10px 12px; border-top-left-radius: 16px; border-top-right-radius: 16px;">
        <div style="width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 8px;"></div>
        <div style="display:flex; justify-content: space-between; align-items: baseline;">
          <span style="font-weight: 600; font-size: 13px;">Bergen</span>
          <span style="font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--fg-3);">285 911</span>
        </div>
      </div>
      <span style="position:absolute; top:6px; left:8px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.35); color:#fff; font: 500 9px var(--font-mono); letter-spacing: 0.04em;">PEEK · 88</span>
    </div>
    <!-- Half -->
    <div style="position: relative; flex:1; background: linear-gradient(180deg, #487C81, #275F76); border-radius: 12px; overflow: hidden;">
      <div style="position:absolute; left:0; right:0; bottom:0; height: 60%; background: var(--surface-1); padding: 10px 12px; border-top-left-radius: 16px; border-top-right-radius: 16px;">
        <div style="width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 8px;"></div>
        <div style="font-weight: 600; font-size: 13px;">Bergen</div>
        <div style="font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; margin-top:4px;">285 911</div>
        <div style="height: 6px; background: var(--surface-2); border-radius: 1px; margin-top: 8px;"><div style="width:78%; height:100%; background:#0E7C86; border-radius:1px;"></div></div>
        <div style="height: 6px; background: var(--surface-2); border-radius: 1px; margin-top: 6px;"><div style="width:55%; height:100%; background:#0E7C86; border-radius:1px;"></div></div>
      </div>
      <span style="position:absolute; top:6px; left:8px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.35); color:#fff; font: 500 9px var(--font-mono); letter-spacing: 0.04em;">HALF · 50 vh</span>
    </div>
    <!-- Full -->
    <div style="position: relative; flex:1; background: var(--surface-1); border-radius: 12px; overflow: hidden;">
      <div style="padding: 10px 12px;">
        <div style="width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 8px;"></div>
        <div style="font-weight: 600; font-size: 13px;">Bergen</div>
        <div style="font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; margin-top:4px;">285 911</div>
        <div style="height: 6px; background: var(--surface-2); border-radius: 1px; margin-top: 10px;"><div style="width:78%; height:100%; background:#0E7C86; border-radius:1px;"></div></div>
        <div style="height: 6px; background: var(--surface-2); border-radius: 1px; margin-top: 6px;"><div style="width:55%; height:100%; background:#0E7C86; border-radius:1px;"></div></div>
        <div style="height: 6px; background: var(--surface-2); border-radius: 1px; margin-top: 6px;"><div style="width:42%; height:100%; background:#0E7C86; border-radius:1px;"></div></div>
        <div style="height: 6px; background: var(--surface-2); border-radius: 1px; margin-top: 6px;"><div style="width:33%; height:100%; background:#0E7C86; border-radius:1px;"></div></div>
      </div>
      <span style="position:absolute; top:6px; left:8px; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); color: var(--fg-2); font: 500 9px var(--font-mono); letter-spacing: 0.04em;">FULL · 100 vh − 56</span>
    </div>
  </div>
</div>
</body>
</html>
