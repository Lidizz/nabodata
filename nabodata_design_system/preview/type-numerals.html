<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Numerals</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="eyebrow">Tabular numerals · always on for data</div>
  <table style="font-family: var(--font-mono); font-size: 14px; width: 100%; border-collapse: collapse;">
    <tbody>
      <tr style="border-bottom: 1px solid var(--border-1);">
        <td style="padding: 6px 0; color: var(--fg-2);">Bergen</td>
        <td style="padding: 6px 0; text-align: right; font-variant-numeric: tabular-nums;">285 911</td>
        <td style="padding: 6px 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--success);">+1,8 %</td>
      </tr>
      <tr style="border-bottom: 1px solid var(--border-1);">
        <td style="padding: 6px 0; color: var(--fg-2);">Trondheim</td>
        <td style="padding: 6px 0; text-align: right; font-variant-numeric: tabular-nums;">214 565</td>
        <td style="padding: 6px 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--success);">+1,2 %</td>
      </tr>
      <tr style="border-bottom: 1px solid var(--border-1);">
        <td style="padding: 6px 0; color: var(--fg-2);">Stavanger</td>
        <td style="padding: 6px 0; text-align: right; font-variant-numeric: tabular-nums;">147 980</td>
        <td style="padding: 6px 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--danger);">−0,3 %</td>
      </tr>
      <tr>
        <td style="padding: 6px 0; color: var(--fg-2);">Tromsø</td>
        <td style="padding: 6px 0; text-align: right; font-variant-numeric: tabular-nums;">  77 544</td>
        <td style="padding: 6px 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--success);">+0,9 %</td>
      </tr>
    </tbody>
  </table>
  <div class="data-label" style="margin-top: 4px;">Norwegian formatting · thin-space thousands · comma decimal</div>
</div>
</body>
</html>
