<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choropleth — Light</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="eyebrow">Choropleth · Light · cool slate-blue · 7 steps</div>
  <div style="display:flex; height: 56px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-1);">
    <div style="flex:1; background:#ECF1F6"></div>
    <div style="flex:1; background:#C9D6E5"></div>
    <div style="flex:1; background:#9CB1CB"></div>
    <div style="flex:1; background:#6E8DAF"></div>
    <div style="flex:1; background:#486D92"></div>
    <div style="flex:1; background:#2C5176"></div>
    <div style="flex:1; background:#15355A"></div>
  </div>
  <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">
    <div>#ECF1F6</div><div>#C9D6E5</div><div>#9CB1CB</div><div>#6E8DAF</div><div>#486D92</div><div>#2C5176</div><div>#15355A</div>
  </div>
  <div style="display:flex; justify-content:space-between; font-size: 11px; color: var(--fg-2); margin-top: 4px;">
    <span>0 – 50 inh./km²</span>
    <span>50 – 200</span>
    <span>200 – 600</span>
    <span>600 – 1 500</span>
    <span>1 500 – 3 000</span>
    <span>3 000 – 6 000</span>
    <span>6 000 +</span>
  </div>
</div>
</body>
</html>
