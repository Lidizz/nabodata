<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Horizontal bar chart</title>
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="h3">Topp opphavsland</div>
    <div class="data-label">av 64 320 innvandrere</div>
  </div>
  <div style="display:flex; flex-direction:column; gap: 6px; font-family: var(--font-sans); font-size: 12px;">
    <div style="display:grid; grid-template-columns: 100px 1fr 56px; align-items: center; gap: 12px;">
      <span>Polen</span>
      <div style="height:8px; background:var(--surface-2); border-radius:1px;"><div style="height:100%; width:78%; background:#0E7C86; border-radius:1px;"></div></div>
      <span style="font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right;">9 412</span>
    </div>
    <div style="display:grid; grid-template-columns: 100px 1fr 56px; align-items: center; gap: 12px;">
      <span>Litauen</span>
      <div style="height:8px; background:var(--surface-2); border-radius:1px;"><div style="height:100%; width:55%; background:#0E7C86; border-radius:1px;"></div></div>
      <span style="font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right;">6 640</span>
    </div>
    <div style="display:grid; grid-template-columns: 100px 1fr 56px; align-items: center; gap: 12px;">
      <span>Sverige</span>
      <div style="height:8px; background:var(--surface-2); border-radius:1px;"><div style="height:100%; width:42%; background:#0E7C86; border-radius:1px;"></div></div>
      <span style="font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right;">5 075</span>
    </div>
    <div style="display:grid; grid-template-columns: 100px 1fr 56px; align-items: center; gap: 12px;">
      <span>Syria</span>
      <div style="height:8px; background:var(--surface-2); border-radius:1px;"><div style="height:100%; width:33%; background:#0E7C86; border-radius:1px;"></div></div>
      <span style="font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right;">3 988</span>
    </div>
    <div style="display:grid; grid-template-columns: 100px 1fr 56px; align-items: center; gap: 12px;">
      <span>Tyskland</span>
      <div style="height:8px; background:var(--surface-2); border-radius:1px;"><div style="height:100%; width:24%; background:#0E7C86; border-radius:1px;"></div></div>
      <span style="font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right;">2 901</span>
    </div>
    <div style="display:grid; grid-template-columns: 100px 1fr 56px; align-items: center; gap: 12px;">
      <span>Eritrea</span>
      <div style="height:8px; background:var(--surface-2); border-radius:1px;"><div style="height:100%; width:18%; background:#0E7C86; border-radius:1px;"></div></div>
      <span style="font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right;">2 174</span>
    </div>
  </div>
</div>
</body>
</html>
