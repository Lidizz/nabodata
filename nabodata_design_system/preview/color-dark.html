<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Colors — Dark surfaces &amp; text</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: #11161D; }
  .swatch .name { color: #ECEFF4; }
  .swatch .hex { color: #828D9C; }
  .eyebrow { color: #828D9C; }
  .swatch .chip { border-color: #1F2731; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Dark theme · surfaces &amp; text</div>
  <div class="grid" style="grid-template-columns: repeat(5, 1fr);">
    <div class="swatch"><div class="chip" style="background:#0B0F14"></div><div class="meta"><div class="name">bg</div><div class="hex">#0B0F14</div></div></div>
    <div class="swatch"><div class="chip" style="background:#11161D"></div><div class="meta"><div class="name">surface-1</div><div class="hex">#11161D</div></div></div>
    <div class="swatch"><div class="chip" style="background:#181E27"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#181E27</div></div></div>
    <div class="swatch"><div class="chip" style="background:#232A35"></div><div class="meta"><div class="name">surface-3</div><div class="hex">#232A35</div></div></div>
    <div class="swatch"><div class="chip" style="background:#2C3540"></div><div class="meta"><div class="name">border-2</div><div class="hex">#2C3540</div></div></div>
  </div>
  <div class="grid" style="grid-template-columns: repeat(4, 1fr);">
    <div class="swatch"><div class="chip" style="background:#ECEFF4"></div><div class="meta"><div class="name">fg-1</div><div class="hex">#ECEFF4</div></div></div>
    <div class="swatch"><div class="chip" style="background:#B6BFCB"></div><div class="meta"><div class="name">fg-2</div><div class="hex">#B6BFCB</div></div></div>
    <div class="swatch"><div class="chip" style="background:#828D9C"></div><div class="meta"><div class="name">fg-3</div><div class="hex">#828D9C</div></div></div>
    <div class="swatch"><div class="chip" style="background:#5B6571"></div><div class="meta"><div class="name">fg-4</div><div class="hex">#5B6571</div></div></div>
  </div>
</div>
</body>
</html>
