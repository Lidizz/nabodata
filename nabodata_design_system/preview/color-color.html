<!doctype html>
<html lang="en" data-theme="color">
<head>
<meta charset="utf-8">
<title>Colors — Color theme surfaces</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: #FAF6EC; }
  .eyebrow { color: #767F78; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Color theme · birch-paper surfaces</div>
  <div class="grid" style="grid-template-columns: repeat(5, 1fr);">
    <div class="swatch"><div class="chip" style="background:#F2EEE3"></div><div class="meta"><div class="name">bg</div><div class="hex">#F2EEE3</div></div></div>
    <div class="swatch"><div class="chip" style="background:#FAF6EC"></div><div class="meta"><div class="name">surface-1</div><div class="hex">#FAF6EC</div></div></div>
    <div class="swatch"><div class="chip" style="background:#ECE6D5"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#ECE6D5</div></div></div>
    <div class="swatch"><div class="chip" style="background:#DDD5BF"></div><div class="meta"><div class="name">surface-3</div><div class="hex">#DDD5BF</div></div></div>
    <div class="swatch"><div class="chip" style="background:#E0D7C2"></div><div class="meta"><div class="name">border-1</div><div class="hex">#E0D7C2</div></div></div>
  </div>
  <div class="grid" style="grid-template-columns: repeat(4, 1fr);">
    <div class="swatch"><div class="chip" style="background:#1F2A24"></div><div class="meta"><div class="name">fg-1</div><div class="hex">#1F2A24</div></div></div>
    <div class="swatch"><div class="chip" style="background:#4A5650"></div><div class="meta"><div class="name">fg-2</div><div class="hex">#4A5650</div></div></div>
    <div class="swatch"><div class="chip" style="background:#767F78"></div><div class="meta"><div class="name">fg-3</div><div class="hex">#767F78</div></div></div>
    <div class="swatch"><div class="chip" style="background:#A19E91"></div><div class="meta"><div class="name">fg-4</div><div class="hex">#A19E91</div></div></div>
  </div>
</div>
</body>
</html>
